services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dailybrief}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dailybrief}
      POSTGRES_DB: ${POSTGRES_DB:-dailybrief}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dailybrief}:${POSTGRES_PASSWORD:-dailybrief}@postgres:5432/${POSTGRES_DB:-dailybrief}?schema=public
      LLM_BACKEND: ${LLM_BACKEND:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-}
      REPORT_LOCALE: ${REPORT_LOCALE:-zh}
      REPORT_TZ: ${REPORT_TZ:-Asia/Shanghai}
      TZ: ${REPORT_TZ:-Asia/Shanghai}
      OUTPUT_MARKDOWN: ${OUTPUT_MARKDOWN:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      DAILY_RUN_TIME: ${DAILY_RUN_TIME:-07:30}
      PRISMA_LOG: ${PRISMA_LOG:-false}
    volumes:
      - ./daily_reports:/app/daily_reports
      - ./logs:/app/logs
    ports:
      - "${WEB_PORT:-3000}:3000"
    command: sh -c "npm run db:deploy && npm run sources:import && npm run start"

  worker:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dailybrief}:${POSTGRES_PASSWORD:-dailybrief}@postgres:5432/${POSTGRES_DB:-dailybrief}?schema=public
      LLM_BACKEND: ${LLM_BACKEND:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-}
      REPORT_LOCALE: ${REPORT_LOCALE:-zh}
      REPORT_TZ: ${REPORT_TZ:-Asia/Shanghai}
      TZ: ${REPORT_TZ:-Asia/Shanghai}
      OUTPUT_MARKDOWN: ${OUTPUT_MARKDOWN:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      DAILY_RUN_TIME: ${DAILY_RUN_TIME:-07:30}
      PRISMA_LOG: ${PRISMA_LOG:-false}
    volumes:
      - ./daily_reports:/app/daily_reports
      - ./logs:/app/logs
    command: sh -c "npm run db:deploy && npm run sources:import && npm run worker"

volumes:
  pg_data:
